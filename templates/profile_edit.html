{% extends "base.html" %}

{% block title %}Edit profile — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Edit profile</h1>
            <p class="auth-subtitle">Update your name and email address</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('edit_profile') }}">
                <div class="form-group">
                    <label for="profile-name">Full name</label>
                    <input type="text" id="profile-name" name="name"
                           class="form-input" placeholder="Nitish Kumar"
                           value="{{ name }}"
                           required autofocus>
                </div>
                <div class="form-group">
                    <label for="profile-email">Email address</label>
                    <input type="email" id="profile-email" name="email"
                           class="form-input" placeholder="nitish@example.com"
                           value="{{ email }}"
                           required>
                </div>
                <button type="submit" class="btn-submit">Save changes</button>
            </form>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('profile') }}">Back to profile</a>
        </p>

    </div>
</section>

{% endblock %}
