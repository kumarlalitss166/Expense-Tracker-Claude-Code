{% extends "base.html" %}

{% block title %}Change password — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Change password</h1>
            <p class="auth-subtitle">Choose a new password for your account</p>
        </div>

        <div class="auth-card">
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('change_password') }}">
                <div class="form-group">
                    <label for="current-password">Current password</label>
                    <input type="password" id="current-password" name="current_password"
                           class="form-input" placeholder="Your current password"
                           required autofocus>
                </div>
                <div class="form-group">
                    <label for="new-password">New password</label>
                    <input type="password" id="new-password" name="new_password"
                           class="form-input" placeholder="Min. 8 characters"
                           required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm new password</label>
                    <input type="password" id="confirm-password" name="confirm_password"
                           class="form-input" placeholder="Repeat the new password"
                           required>
                </div>
                <button type="submit" class="btn-submit">Update password</button>
            </form>
        </div>

        <p class="auth-switch">
            <a href="{{ url_for('profile') }}">Back to profile</a>
        </p>

    </div>
</section>

{% endblock %}
