<div class="history-card">
    <h2 class="profile-heading">Recent transactions</h2>

    {% if recent_transactions %}
    <ul class="history-list">
        {% for tx in recent_transactions %}
        <li class="history-row">
            <span class="history-date">{{ tx.date }}</span>
            <span class="history-category">{{ tx.category }}</span>
            <span class="history-desc">{{ tx.description or "—" }}</span>
            <span class="history-amount">₹{{ "%.2f"|format(tx.amount) }}</span>
        </li>
        {% endfor %}
    </ul>
    {% endif %}

    <p class="history-view-all">
        <a href="{{ url_for('profile_history') }}{% if filter_qs %}?{{ filter_qs }}{% endif %}">View all</a>
    </p>
</div>
