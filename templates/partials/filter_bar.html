{% if error %}
<div class="auth-error" role="alert">{{ error }}</div>
{% endif %}

<form method="GET" action="{{ filter_action }}" class="filter-form">
    <div class="filter-field">
        <label for="filter-category">Category</label>
        <select id="filter-category" name="category" class="form-input">
            <option value="">All categories</option>
            {% for cat in categories %}
            <option value="{{ cat }}" {% if filters.category == cat %}selected{% endif %}>{{ cat }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="filter-field">
        <label for="filter-date-from">From date</label>
        <input type="date" id="filter-date-from" name="date_from"
               class="form-input" value="{{ filters.date_from or '' }}">
    </div>

    <div class="filter-field">
        <label for="filter-date-to">To date</label>
        <input type="date" id="filter-date-to" name="date_to"
               class="form-input" value="{{ filters.date_to or '' }}">
    </div>

    <div class="filter-actions">
        <button type="submit" class="filter-submit">
            <svg class="inline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 6h16"/><path d="M7 12h10"/><path d="M10 18h4"/>
            </svg>
            Apply filters
        </button>
        <a class="filter-clear" href="{{ filter_action }}">Clear filters</a>
    </div>
</form>

{% if filters_active %}
<p class="filter-summary">Filtered by {{ filter_summary }}</p>
{% endif %}
